<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oak Street Auctions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f3f6;--fg:#0a0a0a;--card:#fff;--line:#dfe2e8;--mut:#6a7280;--seg:#e3e5ea;--sel:#fff;--blue:#009cde;--acc:#0a4c8f;--body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090b0e;--fg:#f2f4f7;--card:#14181d;--line:#262c35;--mut:#8f98a6;--seg:#1a1f26;--sel:#353c47;--acc:#009cde}}
:root[data-theme="dark"]{--bg:#090b0e;--fg:#f2f4f7;--card:#14181d;--line:#262c35;--mut:#8f98a6;--seg:#1a1f26;--sel:#353c47;--acc:#009cde}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.3 var(--ui)}
.wrap{max-width:1100px;margin:0 auto;padding:10px}
.hero{position:relative;overflow:hidden;background:#000;color:#fff;border-radius:16px;padding:14px 14px 14px 19px;margin-bottom:10px;border:1px solid #3a3f47}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.hero:after{content:"";position:absolute;right:0;top:0;bottom:0;width:84px;background:repeating-linear-gradient(115deg,transparent 0 9px,#009cde 9px 11px,transparent 11px 17px,#8a9099 17px 18px,transparent 18px 26px);pointer-events:none}
.eye{font:600 10px var(--ui);letter-spacing:.22em;color:#9aa1ab}
h1{position:relative;z-index:1;margin:3px 0 3px;font:italic 800 28px/1 var(--body);text-transform:uppercase;letter-spacing:.01em}
h1 span{color:var(--blue)}
.sub{font:12px var(--ui);color:var(--mut);margin:0 0 8px}
.hero .home{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:2;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.72);border:1px solid #3a3f47;text-decoration:none}
.hero .home:hover{background:#009cde}
.hero .sub{color:#aab0b9;margin:0;position:relative;z-index:1}
.stats{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.stat{flex:1;padding:8px 6px;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font:italic 800 21px/1.1 var(--body);color:var(--acc)}
.stat span{font:600 10px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.bar{display:flex;gap:6px;overflow-x:auto;margin:0 -10px;padding:2px 10px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;font:600 13px var(--ui);color:var(--fg);cursor:pointer}
.chip i{min-width:34px;height:24px;padding:0 6px;border-radius:12px;display:grid;place-items:center;font:800 15px var(--body);letter-spacing:.03em;font-style:normal}
.chip.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,156,222,.35)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:0 0 8px;font:600 14px var(--ui)}
.detail small{display:block;color:var(--mut);font:12px var(--ui);margin:1px 0 0}
.detail div{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.dt{border-radius:6px;padding:2px 7px;font:700 13px var(--body)}
.opt{margin:0 2px 8px}
.opt summary{display:flex;justify-content:flex-end;align-items:center;list-style:none;cursor:pointer;font:500 12px var(--ui);color:var(--mut)}
.opt summary::-webkit-details-marker{display:none}
.opt summary u{text-decoration:none;color:var(--acc);font-weight:600}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:12px;font:13px var(--ui);color:var(--fg)}
.ctl input{accent-color:var(--blue);width:16px;height:16px;vertical-align:-3px;margin-right:4px}
select{font:13px var(--ui);padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.tabs{display:flex;gap:2px;background:var(--seg);padding:2px;border-radius:10px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.top{margin-bottom:6px}.tabs.top .tab{font-size:14px;padding:8px 11px}
.tab{flex:1 0 auto;padding:7px 11px;border:0;border-radius:8px;background:transparent;color:var(--mut);font:600 13px var(--ui);white-space:nowrap;cursor:pointer}
.tab.on{background:var(--sel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.bracket{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 166px;display:flex;flex-direction:column}
.col h4{margin:0 0 5px;padding-bottom:4px;border-bottom:1px solid var(--line);font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);text-align:center}
.games{flex:1;display:flex;flex-direction:column}
.g{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:3px;margin:1px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);min-height:90px}
.slot{display:flex;align-items:center;gap:6px;height:38px;padding:0 7px 0 0;border-radius:7px;font:700 15px var(--body);white-space:nowrap}
.slot.p1{background:#fff;color:#111;overflow:hidden;border:1px solid #cfd4dc}
.slot i{font-style:normal;font-size:12px;opacity:.7;width:14px;text-align:right}
.slot span{flex:1;overflow:hidden;text-overflow:ellipsis}
.slot b{font:800 17px/1 var(--body);letter-spacing:.03em;border-radius:5px;padding:4px 7px;background:rgba(0,0,0,.3);color:#fff}
.slot.p1 b{align-self:stretch;display:grid;place-items:center;width:50px;border-radius:0;padding:0;flex:none}
.slot span.pi{font-size:12px;line-height:1;white-space:normal}
.slot.out{opacity:.35;text-decoration:line-through}
.slot.fade{opacity:.15}
.slot.tbd{background:transparent;border:1px dashed var(--line);color:var(--mut);justify-content:center;padding:0;font-weight:500;letter-spacing:.1em}
.ah{display:flex;justify-content:space-between;align-items:center;margin:0 2px 4px;font:12px var(--ui);color:var(--mut)}
.tabs.sm{margin:0;display:inline-flex;overflow:visible}.tabs.sm .tab{flex:0 0 auto;padding:5px 11px;font-size:12px}
.ag{font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:12px 4px 5px}
.al{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ar{display:flex;align-items:center;gap:10px;padding:7px 11px}
.ar+.ar{border-top:1px solid var(--line)}
.tg{flex:none;min-width:42px;height:30px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font:800 16px var(--body);letter-spacing:.03em}
.am{flex:1;min-width:0}
.an{font:700 16px/1.15 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am small{font:12px var(--ui);color:var(--mut)}
.ap{font:italic 800 19px var(--body)}
.tw{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px);-webkit-overflow-scrolling:touch}
.tw table{border-collapse:separate;border-spacing:0;min-width:100%}
.tw th{position:sticky;top:0;z-index:3;background:var(--card);font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tw th small{display:block;font:500 10px var(--ui);letter-spacing:0;text-transform:none}
.tw td{height:46px;padding:0 8px;text-align:right;font:700 15px var(--body);white-space:nowrap;border-top:1px solid var(--line)}
.tw .c1{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;width:138px;min-width:138px;max-width:138px;overflow:hidden;box-shadow:1px 0 0 var(--line)}
.tw .c9{position:sticky;right:0;z-index:2;background:var(--card);min-width:60px;box-shadow:-1px 0 0 var(--line);font-weight:800}
.tw th.c1,.tw th.c9{z-index:4}
.tw .gh td{background:var(--bg);height:auto;padding:0}
.gt{position:sticky;left:0;width:max-content;max-width:340px;padding:7px 10px;font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.tc{display:flex;align-items:center;gap:7px}
.tw .tg{min-width:36px;height:28px;font-size:15px}
.tw .win,.pos{color:#1f9d4a}.neg{color:#e5484d}
.tw .out .an{color:var(--mut)}
.tw .lh td{background:var(--bg)}.tw .lh .c1,.tw .lh .c9{background:var(--bg)}
.tw .lh .an{font-size:16px}.tw .sub td{height:40px}.tw .sub .an{font-size:15px}
.lbar{display:block;width:4px;height:24px;border-radius:2px;margin:0 16px 0 15px;flex:none}
@media(min-width:700px){.col{flex-basis:200px}h1{font-size:40px}.hero{padding:16px 18px 16px 24px}.hero:after{width:140px}}
.sbar{display:flex;margin-bottom:8px}.sel{flex:1;min-width:0;font:600 14px var(--ui);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.sgl{display:flex;flex-direction:column;gap:8px}.sg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sgh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font:700 15px var(--ui)}.sgh small{margin-left:auto;color:var(--mut);font:12px var(--ui)}
.net{font:700 11px var(--ui);background:var(--fg);color:var(--bg);padding:3px 8px;border-radius:99px;letter-spacing:.03em}
.sgt{display:flex;align-items:center;gap:8px;min-height:36px;font:700 18px var(--body)}.sgt i{font:600 12px var(--ui);font-style:normal;color:var(--mut);width:16px;text-align:right}.sgt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{text-align:center;margin:14px 0 4px;font-size:11px}</style></head>

const sch=()=>{const tmBy=new Map();tm.forEach(t=>t.n.split(" / ").forEach(x=>tmBy.set(x.toLowerCase().trim(),t)));const look=n=>String(n).split(" / ").map(x=>tmBy.get(x.toLowerCase().trim())).find(Boolean)||null;

const stand=()=>{const rows=BID.map((b,i)=>{const ts=tm.filter(t=>t.b===i),sp=ts.reduce((a,t)=>a+(t.bid||0),0),won=ts.reduce((a,t)=>a+earn(t),0);return{b,sp,won,al:ts.filter(t=>!L.has(t)).length,n:ts.length}}).sort((x,y)=>(y.won-y.sp)-(x.won-x.sp)||y.won-x.won),lab=["R64","R32","Sweet 16","Elite 8","Final Four","Title"];

const names=[...S.regs.map(r=>r.name),"Final Four"];if(!names.includes(tab))tab=names[0];
$("view").innerHTML=[["bracket","Bracket"],["standings","Standings"],["auction","Auction Info"],...(DATA.sched&&DATA.sched.length?[["sched","Schedule"]]:[])].map(([k,n])=>`<button class="tab${view===k?" on":""}" onclick="vw('${k}')">${n}</button>`).join("");$("tabs").style.display=view!=="bracket"?"none":"";
